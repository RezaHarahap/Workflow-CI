name: MLflow Retraining CI
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mlflow==2.19.0 pandas==2.2.3 scikit-learn==1.5.2
      - run: mlflow run ./MLProject --env-manager local
      - uses: actions/upload-artifact@v4
        with:
          name: mlflow-training-artifacts
          path: mlruns/
          retention-days: 30
