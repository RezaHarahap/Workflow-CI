name: Generate Submission Evidence

on:
  workflow_dispatch:
  push:
    paths:
      - "Evidence/**"
      - ".github/workflows/evidence.yml"

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas==2.2.3 scikit-learn==1.5.2 prometheus-client==0.21.1 requests==2.32.3 selenium==4.27.1 pillow==11.0.0
      - name: Train model with MLflow autolog
        run: python Evidence/modelling_evidence.py
      - name: Install Prometheus and Grafana
        run: |
          curl -fsSL -o prometheus.tar.gz https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz
          tar -xzf prometheus.tar.gz
          mv prometheus-2.55.1.linux-amd64 prometheus
          curl -fsSL -o grafana.tar.gz https://dl.grafana.com/oss/release/grafana-11.4.0.linux-amd64.tar.gz
          tar -xzf grafana.tar.gz
          mv grafana-v11.4.0 grafana
          cat > prometheus.yml <<'EOF'
          global:
            scrape_interval: 2s
          scrape_configs:
            - job_name: breast_cancer_model
              static_configs:
                - targets: ["127.0.0.1:8000"]
          EOF
          cat > grafana.ini <<'EOF'
          [server]
          http_addr = 127.0.0.1
          http_port = 3000
          [security]
          admin_user = admin
          admin_password = admin
          [auth.anonymous]
          enabled = true
          org_role = Admin
          EOF
      - name: Start real services
        run: |
          RUN_ID=$(python -c "import json;print(json.load(open('evidence_state.json'))['run_id'])")
          mlflow ui --backend-store-uri "$PWD/evidence_mlruns" --host 127.0.0.1 --port 5000 > mlflow-ui.log 2>&1 &
          mlflow models serve -m "runs:/$RUN_ID/model" --backend-store-uri "$PWD/evidence_mlruns" --host 127.0.0.1 --port 5001 --env-manager local > serving.log 2>&1 &
          python Evidence/exporter.py > exporter.log 2>&1 &
          ./prometheus/prometheus --config.file="$PWD/prometheus.yml" --storage.tsdb.path="$PWD/prometheus-data" --web.listen-address=127.0.0.1:9090 > prometheus.log 2>&1 &
          ./grafana/bin/grafana server --homepath "$PWD/grafana" --config "$PWD/grafana.ini" > grafana.log 2>&1 &
          python -m http.server 8800 > report-server.log 2>&1 &
          for port in 5000 5001 8000 9090 3000 8800; do
            for i in {1..60}; do curl -fsS "http://127.0.0.1:$port" >/dev/null 2>&1 && break; sleep 2; done
          done
          sleep 8
      - name: Capture real screenshots
        run: python Evidence/capture_evidence.py
      - name: Copy evidence configuration and logs
        if: always()
        run: |
          mkdir -p "evidence-output/Monitoring dan Logging"
          cp prometheus.yml "evidence-output/Monitoring dan Logging/2.prometheus.yml" || true
          cp Evidence/exporter.py "evidence-output/Monitoring dan Logging/3.prometheus_exporter.py" || true
          cp *.log evidence-output/ 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: submission-evidence
          path: evidence-output
          if-no-files-found: error
          retention-days: 30
