name: Stage Submission Assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-submission-assets.yml'

permissions:
  contents: write
  actions: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/run5 /tmp/run6 /tmp/stage
          mkdir -p /tmp/run5 /tmp/run6 /tmp/stage
          gh run download 33463490719 -n submission-evidence -D /tmp/run5
          gh run download 33492838168 -n submission-evidence -D /tmp/run6
          cp -a /tmp/run5/. /tmp/stage/
          cp /tmp/run6/Membangun_model/screenshoot_artifak.jpg /tmp/stage/Membangun_model/screenshoot_artifak.jpg
          mkdir -p /tmp/stage/Membangun_model/breast_cancer_preprocessing
          cp MLProject/breast_cancer_preprocessing/metadata.json /tmp/stage/Membangun_model/breast_cancer_preprocessing/
          cp MLProject/breast_cancer_preprocessing/test.csv /tmp/stage/Membangun_model/breast_cancer_preprocessing/
          cp MLProject/breast_cancer_preprocessing/train.csv /tmp/stage/Membangun_model/breast_cancer_preprocessing/
      - name: Commit staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B zip-assets-exact
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/stage/. .
          git add -A
          git commit -m 'Stage exact SMSML submission assets' || true
          git push -f origin zip-assets-exact
